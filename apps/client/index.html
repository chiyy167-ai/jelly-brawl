    <!-- 和 LoadingPage 同样的结构：游戏脚本下载期间先显示插画和进度条，脚本到了 React 会原地替换 -->

      <div class="page loading-page">
        <div class="loading-art">
          <div class="loading-bar progress-unknown"><div class="progress-fill" style="width: 100%"></div></div>
        </div>
        <p class="loading-tip first" id="boot-tip">正在启动游戏…</p>
      </div>
    </div>
    <script>
      try {
        if (localStorage.getItem('jelly-brawl.loaded') !== '1') {
          document.getElementById('boot-tip').textContent = '⏳ 首次打开要下载约 2 MB 资源，可能稍慢，请耐心等待～下次打开会快很多';
        }
      } catch (e) {}
    </script>
