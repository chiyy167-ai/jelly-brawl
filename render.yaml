# Render 一键部署联机服务器：Render 后台 New → Blueprint，选这个仓库即可
services:
  - type: web
    name: jelly-brawl-server
    runtime: node
    plan: free
    rootDir: apps/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
    # 服务器会读取 apps/client/src 里的游戏逻辑，改到那里也要重新部署
    buildFilter:
      paths:
        - apps/server/**
        - apps/client/src/game/**
        - apps/client/src/net/protocol.ts
        - apps/client/src/data/**
