<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF5B8F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="果冻擂台">
  <title>Jelly Brawl 果冻擂台</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #9fd8ff; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    body { display: grid; place-items: center; font-family: "Segoe UI", sans-serif; }
    #game { width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 16 / 9)); background: #b7e3ff; touch-action: none; }
    #ui { position: absolute; inset: 0; display: grid; place-items: center; }
    .card { width: min(440px, calc(100% - 32px)); padding: 20px; border-radius: 24px; background: rgba(255,255,255,.92); text-align: center; }
    button, input { font: inherit; margin: 6px; padding: 10px 14px; border-radius: 999px; border: 0; }
    button { background: #ff5b8f; color: white; }
    .row button { width: 28px; height: 28px; padding: 0; }
    .row button.on { outline: 3px solid #243044; }
    .skins button { width: auto; background: #6aa8d8; }
    .warn { color: #b4234a; min-height: 1em; }
    #debug { position: fixed; top: 8px; right: 8px; background: rgba(255,255,255,.92); padding: 8px; border-radius: 12px; font-size: 12px; }
    #debug.shut #fold { display: none; }
    #debug label { display: block; }
    #mute, #update { position: fixed; left: 8px; z-index: 2; }
    #mute { top: 8px; }
    #update { bottom: 8px; background: #fff; padding: 8px 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <canvas id="game" width="720" height="1280"></canvas>
  <div id="ui"></div>
  <button id="mute" type="button">声音开</button>
  <aside id="debug" hidden></aside>
  <div id="update" hidden>新版本已就绪 <button type="button">点击更新</button></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
